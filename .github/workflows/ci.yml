name: DataTrust CI

on:
  pull_request:
  push:
    branches: [main, phase-1-foundation]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @datatrust/web build
      - run: pnpm --filter @datatrust/app build
      - run: pnpm --filter @datatrust/admin build
